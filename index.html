<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — MasterChess</title>
<link rel="icon" href="public/favicon.svg">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-scrim" id="scrim"></div>

  <main class="main" id="main-content">
    <div class="topline">
      <div>
        <h1 id="greeting">Welcome back</h1>
        <p class="text-muted" style="margin:0;">Here's what's happening on your board.</p>
      </div>
    </div>

    <div id="resume-banner"></div>

    <div class="card" style="background:linear-gradient(135deg, rgba(129,182,76,0.16), rgba(129,182,76,0.03)); border-color: rgba(129,182,76,0.28); margin-bottom:1rem;">
      <div class="flex flex-center gap-2" style="justify-content:space-between; flex-wrap:wrap;">
        <div>
          <h2 style="margin-bottom:.25rem;">Play someone right now</h2>
          <p class="text-muted" style="margin:0;">Matchmaking finds you an opponent at your rating in seconds.</p>
        </div>
        <a href="play.html" class="btn btn-primary">
          <svg class="icon"><use href="assets/icons.svg#icon-swords"/></svg>
          Play online
        </a>
      </div>
    </div>

    <div class="topline" style="margin-bottom:0.75rem;">
      <h2 style="margin:0;">Activity</h2>
    </div>
    <div class="feed" id="feed">
      <div class="card skel" style="height:76px;"></div>
      <div class="card skel" style="height:76px;"></div>
      <div class="card skel" style="height:76px;"></div>
    </div>
  </main>
</div>

<script type="module">
import { supabase, requireSession, getProfile } from './js/supabase-client.js';
import { mountShell } from './js/nav.js';

const session = await requireSession();
const user = session.user;
const profile = await getProfile(user.id).catch(() => null);
mountShell({ active: 'index.html', profile });

document.getElementById('greeting').textContent =
  `Welcome back, ${profile?.display_name || profile?.username || 'player'}`;

async function loadResumeBanner() {
  const { data: ongoing } = await supabase
    .from('games')
    .select('id, white_id, black_id, time_control, turn, updated_at')
    .or(`white_id.eq.${user.id},black_id.eq.${user.id}`)
    .eq('status', 'ongoing')
    .order('updated_at', { ascending: false })
    .limit(1);

  const banner = document.getElementById('resume-banner');
  if (ongoing && ongoing.length) {
    const g = ongoing[0];
    const myColor = g.white_id === user.id ? 'w' : 'b';
    const myTurn = g.turn === myColor;
    banner.innerHTML = `
      <div class="card mb-2" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
        <div class="flex flex-center gap-2">
          <span class="badge ${myTurn ? 'badge-brass' : 'badge-info'}">${myTurn ? 'Your move' : "Opponent's move"}</span>
          <span>You have a game in progress.</span>
        </div>
        <a class="btn btn-secondary btn-sm" href="play.html?game=${g.id}">Resume game</a>
      </div>`;
  } else {
    banner.innerHTML = '';
  }
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

async function loadFeed() {
  const feed = document.getElementById('feed');

  const [{ data: recentGames }, { data: recentSolves }] = await Promise.all([
    supabase.from('games')
      .select('id, white_id, black_id, result, end_reason, time_control, rated, updated_at, status')
      .or(`white_id.eq.${user.id},black_id.eq.${user.id}`)
      .eq('status', 'finished')
      .order('updated_at', { ascending: false })
      .limit(8),
    supabase.from('puzzle_solves')
      .select('solved, solved_at, puzzles(rating, title)')
      .eq('user_id', user.id)
      .order('solved_at', { ascending: false })
      .limit(5),
  ]);

  const opponentIds = new Set();
  (recentGames || []).forEach((g) => {
    const oppId = g.white_id === user.id ? g.black_id : g.white_id;
    if (oppId) opponentIds.add(oppId);
  });
  let opponents = {};
  if (opponentIds.size) {
    const { data } = await supabase.from('profiles').select('id, display_name, username').in('id', [...opponentIds]);
    opponents = Object.fromEntries((data || []).map((p) => [p.id, p]));
  }

  const items = [];

  (recentGames || []).forEach((g) => {
    const isWhite = g.white_id === user.id;
    const oppId = isWhite ? g.black_id : g.white_id;
    const opp = opponents[oppId];
    const oppName = opp ? (opp.display_name || opp.username) : (g.white_id && g.black_id ? 'Unknown' : 'Bot');
    const won = (isWhite && g.result === '1-0') || (!isWhite && g.result === '0-1');
    const drew = g.result === '1/2-1/2';
    const outcome = drew ? 'draw' : won ? 'win' : 'loss';
    items.push({
      time: g.updated_at,
      html: `
        <div class="card card-tight flex flex-center gap-2" style="justify-content:space-between;">
          <div class="flex flex-center gap-2">
            <div class="avatar" style="width:34px;height:34px;font-size:.75rem;">${(oppName || '?').slice(0,2).toUpperCase()}</div>
            <div>
              <div style="font-weight:600;font-size:.88rem;">vs ${escapeHtml(oppName)}</div>
              <div class="text-faint text-xs">${g.rated ? 'Rated' : 'Casual'} · ${g.time_control} · ${(g.end_reason || '').replace('-', ' ')}</div>
            </div>
          </div>
          <div class="flex flex-center gap-2">
            <span class="badge ${outcome === 'win' ? 'badge-success' : outcome === 'loss' ? 'badge-danger' : 'badge-info'}">${outcome}</span>
            <span class="text-faint text-xs">${timeAgo(g.updated_at)}</span>
          </div>
        </div>`,
    });
  });

  (recentSolves || []).forEach((s) => {
    items.push({
      time: s.solved_at,
      html: `
        <div class="card card-tight flex flex-center gap-2" style="justify-content:space-between;">
          <div class="flex flex-center gap-2">
            <div class="icon-wrap" style="width:34px;height:34px;border-radius:9px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;color:var(--green-400);">
              <svg class="icon"><use href="assets/icons.svg#icon-puzzle"/></svg>
            </div>
            <div>
              <div style="font-weight:600;font-size:.88rem;">${escapeHtml(s.puzzles?.title || 'Puzzle')}</div>
              <div class="text-faint text-xs">Rating ${s.puzzles?.rating ?? '—'}</div>
            </div>
          </div>
          <div class="flex flex-center gap-2">
            <span class="badge ${s.solved ? 'badge-success' : 'badge-danger'}">${s.solved ? 'solved' : 'missed'}</span>
            <span class="text-faint text-xs">${timeAgo(s.solved_at)}</span>
          </div>
        </div>`,
    });
  });

  items.sort((a, b) => new Date(b.time) - new Date(a.time));

  if (!items.length) {
    feed.innerHTML = `
      <div class="card empty-state">
        <svg><use href="assets/icons.svg#icon-flame"/></svg>
        <p>No activity yet — play a game or solve a puzzle to get your feed going.</p>
      </div>`;
    return;
  }
  feed.innerHTML = items.map((i) => i.html).join('');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

loadResumeBanner();
loadFeed();
</script>
</body>
</html>
