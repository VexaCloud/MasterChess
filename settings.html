<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — MasterChess</title>
<link rel="icon" href="public/favicon.svg">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-scrim" id="scrim"></div>

  <main class="main main-narrow" id="main-content">
    <div class="topline"><h1>Settings</h1></div>

    <div class="card mb-2">
      <h3>Profile</h3>
      <div id="profile-alert"></div>
      <div class="form-group">
        <label for="display-name">Display name</label>
        <input type="text" id="display-name">
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username">
      </div>
      <div class="form-group">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="3" placeholder="A line about your chess."></textarea>
      </div>
      <div class="form-group">
        <label for="country">Country</label>
        <input type="text" id="country" placeholder="e.g. United States">
      </div>
      <button class="btn btn-primary" id="save-profile-btn">Save profile</button>
    </div>

    <div class="card mb-2">
      <h3>Password</h3>
      <div id="password-alert"></div>
      <div class="form-group">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" minlength="6" placeholder="••••••••">
      </div>
      <button class="btn btn-secondary" id="save-password-btn">Update password</button>
    </div>

    <div class="card">
      <h3>Account</h3>
      <p class="text-muted">Signed in as <strong id="account-email"></strong>.</p>
      <button class="btn btn-danger" id="sign-out-btn">Sign out</button>
    </div>
  </main>
</div>

<script type="module">
import { supabase, requireSession, getProfile, signOut } from './js/supabase-client.js';
import { mountShell } from './js/nav.js';

const session = await requireSession();
const user = session.user;
let profile = await getProfile(user.id);
mountShell({ active: 'settings.html', profile });

document.getElementById('account-email').textContent = user.email;
document.getElementById('display-name').value = profile.display_name || '';
document.getElementById('username').value = profile.username || '';
document.getElementById('bio').value = profile.bio || '';
document.getElementById('country').value = profile.country || '';

document.getElementById('save-profile-btn').onclick = async () => {
  const alertBox = document.getElementById('profile-alert');
  const username = document.getElementById('username').value.trim();
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
    alertBox.innerHTML = '<div class="alert alert-danger mb-2">Username must be 3-20 letters, numbers or underscores.</div>';
    return;
  }
  const updates = {
    display_name: document.getElementById('display-name').value.trim() || username,
    username,
    bio: document.getElementById('bio').value.trim() || null,
    country: document.getElementById('country').value.trim() || null,
    updated_at: new Date().toISOString(),
  };
  const { error } = await supabase.from('profiles').update(updates).eq('id', user.id);
  alertBox.innerHTML = error
    ? `<div class="alert alert-danger mb-2">${error.message.includes('duplicate') ? 'That username is taken.' : error.message}</div>`
    : '<div class="alert alert-success mb-2">Saved.</div>';
  if (!error) mountShell({ active: 'settings.html', profile: { ...profile, ...updates } });
};

document.getElementById('save-password-btn').onclick = async () => {
  const alertBox = document.getElementById('password-alert');
  const pw = document.getElementById('new-password').value;
  if (pw.length < 6) { alertBox.innerHTML = '<div class="alert alert-danger">Password must be at least 6 characters.</div>'; return; }
  const { error } = await supabase.auth.updateUser({ password: pw });
  alertBox.innerHTML = error
    ? `<div class="alert alert-danger">${error.message}</div>`
    : '<div class="alert alert-success">Password updated.</div>';
  document.getElementById('new-password').value = '';
};

document.getElementById('sign-out-btn').onclick = () => signOut();
</script>
</body>
</html>
