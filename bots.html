<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bots – MasterChess</title>
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div style="display:none">
    <svg xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
      <symbol id="icon-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></symbol>
      <symbol id="icon-puzzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19.5 12.5a2.5 2.5 0 0 1 0 5H17v2a2 2 0 0 1-2 2h-2.5a2.5 2.5 0 0 1 0-5H15v-2a2 2 0 0 1 2-2h2.5z"/></symbol>
      <symbol id="icon-learn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
      <symbol id="icon-variants" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1"/></symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
      <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="icon-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L9 7h6l-3-5zM8 8v3h2v2H8v2h2v2H6v-2H4v-2h2V11H4V8h4zm8 0v3h2v2h-2v2h2v2h-4v-2h-2v-2h2V11h-2V8h4z"/></symbol>
    </svg>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo"><svg class="icon-lg"><use href="#icon-logo"/></svg> MasterChess</div>
      <nav>
        <a href="index.html"><svg class="icon"><use href="#icon-home"/></svg> Home</a>
        <a href="play.html"><svg class="icon"><use href="#icon-play"/></svg> Play</a>
        <a href="bots.html" class="active"><svg class="icon"><use href="#icon-bot"/></svg> Bots</a>
        <a href="puzzles.html"><svg class="icon"><use href="#icon-puzzle"/></svg> Puzzles</a>
        <a href="learn.html"><svg class="icon"><use href="#icon-learn"/></svg> Learn</a>
        <a href="variants.html"><svg class="icon"><use href="#icon-variants"/></svg> Variants</a>
        <a href="tournaments.html"><svg class="icon"><use href="#icon-trophy"/></svg> Tournaments</a>
        <a href="clubs.html"><svg class="icon"><use href="#icon-users"/></svg> Clubs</a>
        <a href="analysis.html"><svg class="icon"><use href="#icon-search"/></svg> Analysis</a>
        <a href="profile.html"><svg class="icon"><use href="#icon-user"/></svg> Profile</a>
      </nav>
    </aside>

    <main class="main">
      <h1 class="mb-2">Bots & Coaches</h1>
      <p class="text-muted mb-2">All 30+ unique personalities unlocked for free. Each has distinct style, strength (Stockfish skill/depth), and unique comments during the game.</p>

      <div class="tabs" id="filter-tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="coach">Coaches</button>
        <button class="tab" data-filter="beginner">Beginner</button>
        <button class="tab" data-filter="intermediate">Intermediate</button>
        <button class="tab" data-filter="advanced">Advanced</button>
        <button class="tab" data-filter="engine">Engine</button>
      </div>

      <div class="grid grid-2" id="bot-list"></div>
    </main>
  </div>

  <script src="js/bots.js"></script>
  <script>
    const list = document.getElementById('bot-list');
    function render(filter = 'all') {
      list.innerHTML = '';
      let bots = window.MasterChessBots.BOTS;
      if (filter === 'coach') bots = bots.filter(b => b.style === 'coach');
      else if (filter === 'beginner') bots = bots.filter(b => b.elo < 1000);
      else if (filter === 'intermediate') bots = bots.filter(b => b.elo >= 1000 && b.elo < 1700);
      else if (filter === 'advanced') bots = bots.filter(b => b.elo >= 1700 && b.elo < 2200);
      else if (filter === 'engine') bots = bots.filter(b => b.style === 'engine' || b.elo >= 2200);

      bots.forEach(bot => {
        const card = document.createElement('a');
        card.href = `play.html?bot=${bot.id}`;
        card.className = 'card bot-card';
        card.innerHTML = `
          <div class="bot-avatar" style="border-color:${bot.color}; color:${bot.color}">${bot.avatar}</div>
          <div class="bot-meta">
            <h3>${bot.name}</h3>
            <div class="bot-elo">${bot.elo} Elo · ${bot.style}</div>
            <p class="text-muted text-sm mt-1">Skill ${bot.skill}/20 · Depth ~${bot.depth}</p>
            <p class="text-sm" style="margin-top:0.35rem">"${(bot.comments.start && bot.comments.start[0]) || '...'}"</p>
          </div>
        `;
        list.appendChild(card);
      });
    }
    render();
    document.querySelectorAll('#filter-tabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#filter-tabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        render(tab.dataset.filter);
      });
    });
  </script>
</body>
</html>
