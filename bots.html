<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bots — MasterChess</title>
<link rel="icon" href="public/favicon.svg">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-scrim" id="scrim"></div>

  <main class="main" id="main-content">
    <div class="topline">
      <h1>Bots</h1>
    </div>
    <p class="text-muted mb-2">Each bot plays with its own real strength and style, powered by Stockfish under the hood.</p>
    <div class="choice-feed" id="bots-feed"></div>
  </main>
</div>

<script type="module">
import { requireSession, getProfile } from './js/supabase-client.js';
import { mountShell } from './js/nav.js';
import { BOTS } from './js/bots.js';

const session = await requireSession();
const myProfile = await getProfile(session.user.id).catch(() => null);
mountShell({ active: 'bots.html', profile: myProfile });

document.getElementById('bots-feed').innerHTML = BOTS.map((b) => `
  <a class="choice-card" href="play.html?mode=bot&bot=${encodeURIComponent(b.id)}">
    <div class="avatar" style="width:44px;height:44px;font-size:.85rem;background:${b.color};flex-shrink:0;">${escapeHtml(b.avatar)}</div>
    <div class="body">
      <div class="title">${escapeHtml(b.name)}</div>
      <div class="sub">${escapeHtml(b.style)} · unique personality & comments</div>
    </div>
    <div class="trail">${b.elo}</div>
  </a>
`).join('');

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
