<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play — MasterChess</title>
<link rel="icon" href="public/favicon.svg">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-scrim" id="scrim"></div>

  <main class="main" id="main-content">

    <!-- ============ SETUP VIEW ============ -->
    <div id="setup-view">
      <div class="topline"><h1>Play</h1></div>

      <div class="choice-feed mb-2" id="mode-feed">
        <button class="choice-card selected" data-mode="online">
          <div class="icon-wrap"><svg class="icon"><use href="assets/icons.svg#icon-globe"/></svg></div>
          <div class="body">
            <div class="title">Play online</div>
            <div class="sub">Get matched with an opponent near your rating</div>
          </div>
          <input type="radio" name="mode" checked>
        </button>
        <button class="choice-card" data-mode="bot">
          <div class="icon-wrap"><svg class="icon"><use href="assets/icons.svg#icon-bot"/></svg></div>
          <div class="body">
            <div class="title">Play a bot</div>
            <div class="sub">Pick a personality and a strength</div>
          </div>
          <input type="radio" name="mode">
        </button>
        <button class="choice-card" data-mode="local">
          <div class="icon-wrap"><svg class="icon"><use href="assets/icons.svg#icon-users"/></svg></div>
          <div class="body">
            <div class="title">Pass and play</div>
            <div class="sub">Two players, one screen</div>
          </div>
          <input type="radio" name="mode">
        </button>
      </div>

      <!-- online options -->
      <div id="online-options">
        <h3 class="text-sm text-faint" style="text-transform:uppercase;letter-spacing:.05em;">Time control</h3>
        <div class="chip-row mb-2" id="tc-chips"></div>
        <button class="btn btn-primary" id="find-match-btn">
          <svg class="icon"><use href="assets/icons.svg#icon-swords"/></svg>
          Find a match
        </button>
      </div>

      <!-- bot options -->
      <div id="bot-options" style="display:none;">
        <h3 class="text-sm text-faint" style="text-transform:uppercase;letter-spacing:.05em;">Choose an opponent</h3>
        <div class="choice-feed mb-2" id="bot-feed" style="max-height:340px;overflow-y:auto;"></div>
        <h3 class="text-sm text-faint" style="text-transform:uppercase;letter-spacing:.05em;">Play as</h3>
        <div class="chip-row mb-2" id="color-chips">
          <div class="chip selected" data-color="random">Random</div>
          <div class="chip" data-color="w">White</div>
          <div class="chip" data-color="b">Black</div>
        </div>
        <h3 class="text-sm text-faint" style="text-transform:uppercase;letter-spacing:.05em;">Time control</h3>
        <div class="chip-row mb-2" id="bot-tc-chips">
          <div class="chip selected" data-tc="unlimited">Unlimited</div>
          <div class="chip" data-tc="600|0">10+0</div>
          <div class="chip" data-tc="300|0">5+0</div>
          <div class="chip" data-tc="180|2">3+2</div>
        </div>
        <button class="btn btn-primary" id="start-bot-btn">Start game</button>
      </div>

      <!-- local options -->
      <div id="local-options" style="display:none;">
        <p class="text-muted">Set the board down between two players. No account needed on the other side of the screen.</p>
        <button class="btn btn-primary" id="start-local-btn">Start local game</button>
      </div>
    </div>

    <!-- ============ GAME VIEW ============ -->
    <div id="game-view" style="display:none;">
      <div class="board-scene">
        <div class="board-column">
          <div class="board-frame">
            <div class="board-square-wrap" id="board-wrap">
              <div id="board"></div>
              <div class="mm-overlay" id="mm-overlay" style="display:none;">
                <div class="mm-spinner"></div>
                <div>
                  <div style="font-weight:700;">Finding an opponent…</div>
                  <div class="text-muted text-sm" id="mm-status">Searching</div>
                </div>
                <button class="btn btn-secondary btn-sm" id="cancel-match-btn">Cancel</button>
              </div>
            </div>
          </div>
          <div class="board-controls">
            <button class="btn btn-secondary btn-sm" id="flip-btn">
              <svg class="icon"><use href="assets/icons.svg#icon-shuffle"/></svg> Flip
            </button>
            <button class="btn btn-secondary btn-sm" id="new-game-btn">New game</button>
            <button class="btn btn-danger btn-sm" id="resign-btn" style="display:none;">Resign</button>
            <button class="btn btn-secondary btn-sm" id="draw-btn" style="display:none;">Offer draw</button>
          </div>
        </div>

        <div class="game-panel">
          <div id="status-area"></div>
          <div class="player-row" id="row-top"></div>
          <div class="move-list-panel">
            <div class="move-list" id="move-list"></div>
          </div>
          <div class="player-row" id="row-bottom"></div>
        </div>
      </div>
    </div>

  </main>
</div>

<script type="module">
import { supabase, requireSession, getProfile, initials } from './js/supabase-client.js';
import { mountShell } from './js/nav.js';
import { callFunction } from './js/api.js';
import { GameController } from './js/chess-core.js';
import { BoardUI } from './js/board-ui.js';
import { StockfishEngine } from './js/stockfish-engine.js';
import { CONFIG } from './js/config.js';
import { BOTS, getBotById } from './js/bots.js';

const session = await requireSession();
const user = session.user;
const myProfile = await getProfile(user.id).catch(() => null);
mountShell({ active: 'play.html', profile: myProfile });

const setupView = document.getElementById('setup-view');
const gameView = document.getElementById('game-view');

let mode = 'online';
let selectedTc = '300|0';
let selectedBot = BOTS[0];
let selectedColor = 'random';
let selectedBotTc = 'unlimited';

// ---------- mode / setup UI ----------
document.querySelectorAll('#mode-feed .choice-card').forEach((card) => {
  card.addEventListener('click', () => {
    mode = card.dataset.mode;
    document.querySelectorAll('#mode-feed .choice-card').forEach((c) => {
      c.classList.toggle('selected', c === card);
      c.querySelector('input').checked = c === card;
    });
    document.getElementById('online-options').style.display = mode === 'online' ? 'block' : 'none';
    document.getElementById('bot-options').style.display = mode === 'bot' ? 'block' : 'none';
    document.getElementById('local-options').style.display = mode === 'local' ? 'block' : 'none';
  });
});

function buildTcChips() {
  const wrap = document.getElementById('tc-chips');
  const groups = CONFIG.timeControls;
  wrap.innerHTML = '';
  Object.entries(groups).forEach(([bucket, list]) => {
    list.forEach((tc) => {
      const el = document.createElement('div');
      el.className = 'chip' + (`${tc.base}|${tc.increment}` === selectedTc ? ' selected' : '');
      el.textContent = tc.label;
      el.dataset.tc = `${tc.base}|${tc.increment}`;
      el.onclick = () => {
        selectedTc = el.dataset.tc;
        wrap.querySelectorAll('.chip').forEach((c) => c.classList.toggle('selected', c === el));
      };
      wrap.appendChild(el);
    });
  });
}
buildTcChips();

function buildBotFeed() {
  const wrap = document.getElementById('bot-feed');
  wrap.innerHTML = BOTS.map((b, i) => `
    <button class="choice-card ${i === 0 ? 'selected' : ''}" data-bot="${b.id}">
      <div class="icon-wrap"><svg class="icon"><use href="assets/icons.svg#icon-bot"/></svg></div>
      <div class="body">
        <div class="title">${b.name}</div>
        <div class="sub">${b.style || b.description || ''}</div>
      </div>
      <div class="trail">${b.elo}</div>
    </button>
  `).join('');
  wrap.querySelectorAll('.choice-card').forEach((card) => {
    card.onclick = () => {
      selectedBot = getBotById(card.dataset.bot);
      wrap.querySelectorAll('.choice-card').forEach((c) => c.classList.toggle('selected', c === card));
    };
  });
}
buildBotFeed();

document.querySelectorAll('#color-chips .chip').forEach((chip) => {
  chip.onclick = () => {
    selectedColor = chip.dataset.color;
    document.querySelectorAll('#color-chips .chip').forEach((c) => c.classList.toggle('selected', c === chip));
  };
});
document.querySelectorAll('#bot-tc-chips .chip').forEach((chip) => {
  chip.onclick = () => {
    selectedBotTc = chip.dataset.tc;
    document.querySelectorAll('#bot-tc-chips .chip').forEach((c) => c.classList.toggle('selected', c === chip));
  };
});

document.getElementById('find-match-btn').onclick = () => startOnlineMatch(selectedTc);
document.getElementById('start-bot-btn').onclick = () => startBotGame();
document.getElementById('start-local-btn').onclick = () => startLocalGame();
document.getElementById('new-game-btn').onclick = () => {
  teardownGame();
  setupView.style.display = 'block';
  gameView.style.display = 'none';
  history.replaceState(null, '', 'play.html');
};

// ---------- shared game state ----------
let controller = null;
let boardUI = null;
let currentGameId = null;
let myColor = 'w';
let gameChannel = null;
let clockInterval = null;
let botEngine = null;
let gameKind = 'local'; // 'online' | 'bot' | 'local'
let queuePoll = null;

function teardownGame() {
  if (gameChannel) { supabase.removeChannel(gameChannel); gameChannel = null; }
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
  if (queuePoll) { clearInterval(queuePoll); queuePoll = null; }
  if (botEngine) { botEngine.terminate(); botEngine = null; }
  currentGameId = null;
}

function showGameView() {
  setupView.style.display = 'none';
  gameView.style.display = 'block';
  document.getElementById('mm-overlay').style.display = 'none';
}

// ---------- ONLINE ----------
async function startOnlineMatch(timeControl) {
  showGameView();
  gameKind = 'online';
  document.getElementById('resign-btn').style.display = 'inline-flex';
  document.getElementById('draw-btn').style.display = 'inline-flex';
  document.getElementById('mm-overlay').style.display = 'flex';
  document.getElementById('board').innerHTML = '';

  let tries = 0;
  const poll = async () => {
    tries++;
    document.getElementById('mm-status').textContent = tries < 3 ? 'Searching' : `Searching… (${tries * 2}s)`;
    try {
      const res = await callFunction('matchmake', { action: 'join', time_control: timeControl });
      if (res.matched) {
        clearInterval(queuePoll); queuePoll = null;
        await loadOnlineGame(res.game_id);
      }
    } catch (err) {
      console.error(err);
    }
  };
  await poll();
  if (!currentGameId) queuePoll = setInterval(poll, 2500);

  document.getElementById('cancel-match-btn').onclick = async () => {
    if (queuePoll) { clearInterval(queuePoll); queuePoll = null; }
    await callFunction('matchmake', { action: 'leave' }).catch(() => {});
    setupView.style.display = 'block';
    gameView.style.display = 'none';
  };
}

async function loadOnlineGame(gameId) {
  const { data: game } = await supabase.from('games').select('*').eq('id', gameId).single();
  if (!game) return;
  currentGameId = gameId;
  history.replaceState(null, '', `play.html?game=${gameId}`);
  myColor = game.white_id === user.id ? 'w' : 'b';

  await mountGame(game);

  gameChannel = supabase
    .channel(`game-${gameId}`)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${gameId}` }, (payload) => {
      applyRemoteGameState(payload.new);
    })
    .subscribe();
}

function applyRemoteGameState(game) {
  if (game.fen !== controller.fen) {
    controller.load(game.fen);
    const lastMove = Array.isArray(game.moves) && game.moves.length ? game.moves[game.moves.length - 1] : null;
    boardUI.setLastMove(lastMove?.from, lastMove?.to);
    boardUI.render();
  }
  renderPlayers(game);
  renderMoveList(game.moves || []);
  renderStatus(game);
  syncClocks(game);
}

// ---------- BOT ----------
async function startBotGame() {
  showGameView();
  gameKind = 'bot';
  document.getElementById('resign-btn').style.display = 'inline-flex';
  document.getElementById('draw-btn').style.display = 'none';

  const res = await callFunction('create-bot-game', {
    bot_id: selectedBot.id, color: selectedColor, time_control: selectedBotTc,
  });
  currentGameId = res.game.id;
  myColor = res.player_color;
  history.replaceState(null, '', `play.html?game=${currentGameId}&bot=${selectedBot.id}`);

  botEngine = new StockfishEngine();
  await botEngine.init();

  await mountGame(res.game);

  if (controller.turn !== myColor) triggerBotMove();
}

async function triggerBotMove() {
  if (!currentGameId || controller.isGameOver) return;
  await new Promise((r) => setTimeout(r, 300 + Math.random() * 500));
  const uci = await botEngine.bestMove(controller.fen, {
    depth: selectedBot.depth || 10,
    skillLevel: selectedBot.skill ?? 8,
  });
  if (!uci || !currentGameId) return;
  const from = uci.slice(0, 2), to = uci.slice(2, 4), promotion = uci.slice(4) || undefined;
  try {
    await callFunction('make-move', { game_id: currentGameId, from, to, promotion, as_bot: true });
    const { data: game } = await supabase.from('games').select('*').eq('id', currentGameId).single();
    applyLocalGameState(game);
  } catch (err) {
    console.error('bot move failed', err);
  }
}

function applyLocalGameState(game) {
  controller.load(game.fen);
  const lastMove = Array.isArray(game.moves) && game.moves.length ? game.moves[game.moves.length - 1] : null;
  boardUI.setLastMove(lastMove?.from, lastMove?.to);
  boardUI.render();
  renderPlayers(game);
  renderMoveList(game.moves || []);
  renderStatus(game);
  syncClocks(game);
}

// ---------- LOCAL PASS & PLAY ----------
function startLocalGame() {
  showGameView();
  gameKind = 'local';
  document.getElementById('resign-btn').style.display = 'none';
  document.getElementById('draw-btn').style.display = 'none';
  currentGameId = null;
  myColor = 'w';
  controller = new GameController();
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  boardUI = new BoardUI({
    container: boardEl,
    controller,
    orientation: 'w',
    interactive: true,
    perspectiveColor: null,
    onMove: (from, to, promotion) => {
      const m = controller.move({ from, to, promotion });
      if (!m) return false;
      boardUI.setLastMove(from, to);
      boardUI.render();
      renderMoveList(controller.history.map((h) => ({ san: h.san })));
      renderLocalStatus();
      return true;
    },
  });
  renderPlayers({ white_id: null, black_id: null, time_control: 'unlimited' }, true);
  renderMoveList([]);
  document.getElementById('status-area').innerHTML = '';
}

function renderLocalStatus() {
  const statusArea = document.getElementById('status-area');
  if (controller.isCheckmate) {
    statusArea.innerHTML = `<div class="status-banner">${controller.turn === 'w' ? 'Black' : 'White'} wins by checkmate</div>`;
  } else if (controller.isStalemate) {
    statusArea.innerHTML = `<div class="status-banner draw">Draw by stalemate</div>`;
  } else if (controller.isDraw) {
    statusArea.innerHTML = `<div class="status-banner draw">Draw</div>`;
  } else {
    statusArea.innerHTML = '';
  }
}

// ---------- shared mount / render ----------
async function mountGame(game) {
  controller = new GameController(game.fen);
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  boardUI = new BoardUI({
    container: boardEl,
    controller,
    orientation: myColor,
    interactive: true,
    perspectiveColor: myColor,
    onMove: async (from, to, promotion) => {
      if (controller.turn !== myColor) return false;
      const snapshotFen = controller.fen;
      const m = controller.move({ from, to, promotion });
      if (!m) return false;
      boardUI.setLastMove(from, to);
      boardUI.render();
      try {
        await callFunction('make-move', { game_id: currentGameId, from, to, promotion });
      } catch (err) {
        controller.load(snapshotFen);
        boardUI.render();
        alert(err.message);
        return false;
      }
      if (gameKind === 'bot') {
        const { data: fresh } = await supabase.from('games').select('*').eq('id', currentGameId).single();
        applyLocalGameState(fresh);
        if (fresh.status === 'ongoing') triggerBotMove();
      }
      return true;
    },
  });
  const lastMove = Array.isArray(game.moves) && game.moves.length ? game.moves[game.moves.length - 1] : null;
  boardUI.setLastMove(lastMove?.from, lastMove?.to);

  await renderPlayers(game);
  renderMoveList(game.moves || []);
  renderStatus(game);
  syncClocks(game);

  document.getElementById('resign-btn').onclick = async () => {
    if (!confirm('Resign this game?')) return;
    await callFunction('game-action', { game_id: currentGameId, action: 'resign' });
    if (gameKind === 'bot') {
      const { data: fresh } = await supabase.from('games').select('*').eq('id', currentGameId).single();
      applyLocalGameState(fresh);
    }
  };
  document.getElementById('draw-btn').onclick = async () => {
    const { data: g } = await supabase.from('games').select('draw_offered_by').eq('id', currentGameId).single();
    if (g.draw_offered_by && g.draw_offered_by !== user.id) {
      await callFunction('game-action', { game_id: currentGameId, action: 'accept_draw' });
    } else {
      await callFunction('game-action', { game_id: currentGameId, action: 'offer_draw' });
      document.getElementById('draw-btn').textContent = 'Draw offered';
    }
  };
}

const profileCache = new Map();
async function fetchProfile(id) {
  if (!id) return null;
  if (profileCache.has(id)) return profileCache.get(id);
  const { data } = await supabase.from('profiles').select('id, display_name, username, ratings').eq('id', id).single();
  profileCache.set(id, data);
  return data;
}

async function renderPlayers(game, isLocal = false) {
  const topIsWhite = myColor === 'b';
  const topId = topIsWhite ? game.white_id : game.black_id;
  const bottomId = topIsWhite ? game.black_id : game.white_id;

  const [topProfile, bottomProfile] = await Promise.all([fetchProfile(topId), fetchProfile(bottomId)]);

  const rowTop = document.getElementById('row-top');
  const rowBottom = document.getElementById('row-bottom');

  const label = (p, id, color) => {
    if (isLocal) return color === 'w' ? 'White' : 'Black';
    if (id === user.id) return 'You';
    if (p) return p.display_name || p.username;
    if (gameKind === 'bot') return selectedBot.name;
    return 'Waiting…';
  };

  rowTop.innerHTML = playerRowHtml(label(topProfile, topId, topIsWhite ? 'w' : 'b'), topProfile, game, topIsWhite ? 'w' : 'b');
  rowBottom.innerHTML = playerRowHtml(label(bottomProfile, bottomId, topIsWhite ? 'b' : 'w'), bottomProfile, game, topIsWhite ? 'b' : 'w');
}

function playerRowHtml(name, profile, game, color) {
  const rating = profile?.ratings?.rapid ?? (color === myColor ? '' : selectedBot?.elo ?? '');
  return `
    <div class="avatar">${initials(name)}</div>
    <div class="info">
      <div class="name">${escapeHtml(name)}</div>
      <div class="rating">${rating || ''}</div>
    </div>
    <div class="clock mono" data-color="${color}" id="clock-${color}">${formatClock(color === 'w' ? game.white_clock : game.black_clock)}</div>
  `;
}

function formatClock(sec) {
  if (sec === null || sec === undefined) return '∞';
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

let clockState = { white: null, black: null, turn: 'w', lastMoveAt: null, running: false };
function syncClocks(game) {
  clockState = {
    white: game.white_clock, black: game.black_clock, turn: game.turn,
    lastMoveAt: game.last_move_at ? new Date(game.last_move_at).getTime() : Date.now(),
    running: game.status === 'ongoing' && game.white_clock != null,
  };
  if (clockInterval) clearInterval(clockInterval);
  if (!clockState.running) { tickClocks(); return; }
  clockInterval = setInterval(tickClocks, 250);
  tickClocks();
}
function tickClocks() {
  const elapsed = clockState.running ? (Date.now() - clockState.lastMoveAt) / 1000 : 0;
  const white = clockState.turn === 'w' ? Math.max(0, clockState.white - elapsed) : clockState.white;
  const black = clockState.turn === 'b' ? Math.max(0, clockState.black - elapsed) : clockState.black;
  const wEl = document.getElementById('clock-w'), bEl = document.getElementById('clock-b');
  if (wEl) { wEl.textContent = formatClock(white); wEl.classList.toggle('active', clockState.turn === 'w' && clockState.running); wEl.classList.toggle('low', white < 20 && white !== null); }
  if (bEl) { bEl.textContent = formatClock(black); bEl.classList.toggle('active', clockState.turn === 'b' && clockState.running); bEl.classList.toggle('low', black < 20 && black !== null); }
}

function renderMoveList(moves) {
  const el = document.getElementById('move-list');
  if (!moves.length) { el.innerHTML = '<div class="text-faint text-sm" style="padding:.85rem;">No moves yet.</div>'; return; }
  let html = '';
  for (let i = 0; i < moves.length; i += 2) {
    const num = i / 2 + 1;
    const white = moves[i]?.san || '';
    const black = moves[i + 1]?.san || '';
    html += `<div class="move-row"><span class="num">${num}.</span><span>${white}</span><span>${black}</span></div>`;
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function renderStatus(game) {
  const statusArea = document.getElementById('status-area');
  if (game.status !== 'finished') {
    if (game.draw_offered_by && game.draw_offered_by !== user.id) {
      statusArea.innerHTML = `<div class="alert mb-1">Your opponent offered a draw. <button class="btn btn-sm btn-primary" id="accept-draw-inline">Accept</button></div>`;
      document.getElementById('accept-draw-inline').onclick = async () => {
        await callFunction('game-action', { game_id: currentGameId, action: 'accept_draw' });
      };
    } else {
      statusArea.innerHTML = '';
    }
    return;
  }
  let text, cls;
  if (game.result === '1/2-1/2') { text = `Draw · ${prettyReason(game.end_reason)}`; cls = 'draw'; }
  else {
    const iWon = (game.result === '1-0' && myColor === 'w') || (game.result === '0-1' && myColor === 'b');
    text = `${iWon ? 'You won' : 'You lost'} · ${prettyReason(game.end_reason)}`;
    cls = iWon ? 'win' : 'loss';
  }
  statusArea.innerHTML = `<div class="status-banner ${cls}">${text}</div>`;
  if (gameChannel) { supabase.removeChannel(gameChannel); gameChannel = null; }
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
}
function prettyReason(r) { return (r || '').replace(/-/g, ' '); }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.getElementById('flip-btn').onclick = () => boardUI?.flip();

// ---------- deep link: resume a specific game, or preselect a mode ----------
const params = new URLSearchParams(location.search);

if (!params.get('game') && params.get('mode') === 'bot') {
  document.querySelector('#mode-feed [data-mode="bot"]').click();
  const wantedBotId = params.get('bot');
  if (wantedBotId) {
    const card = document.querySelector(`#bot-feed [data-bot="${wantedBotId}"]`);
    if (card) card.click();
  }
}

const resumeId = params.get('game');
if (resumeId) {
  const { data: game } = await supabase.from('games').select('*').eq('id', resumeId).maybeSingle();
  if (game && (game.white_id === user.id || game.black_id === user.id)) {
    showGameView();
    myColor = game.white_id === user.id ? 'w' : 'b';
    gameKind = game.bot_id ? 'bot' : 'online';
    currentGameId = game.id;
    document.getElementById('resign-btn').style.display = 'inline-flex';
    document.getElementById('draw-btn').style.display = gameKind === 'online' ? 'inline-flex' : 'none';
    if (gameKind === 'bot') {
      const botId = params.get('bot') || game.bot_id;
      selectedBot = getBotById(botId);
      botEngine = new StockfishEngine();
      await botEngine.init();
    }
    await mountGame(game);
    if (gameKind === 'online') {
      gameChannel = supabase
        .channel(`game-${game.id}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${game.id}` }, (payload) => applyRemoteGameState(payload.new))
        .subscribe();
    } else if (gameKind === 'bot' && game.status === 'ongoing' && controller.turn !== myColor) {
      triggerBotMove();
    }
  }
}
</script>
