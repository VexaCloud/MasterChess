<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — MasterChess</title>
<link rel="icon" href="public/favicon.svg">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-scrim" id="scrim"></div>

  <main class="main main-narrow" id="main-content">
    <div class="card mb-2" id="profile-header"></div>

    <div class="card mb-2">
      <h3>Ratings</h3>
      <div id="ratings-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;"></div>
    </div>

    <div class="topline"><h2 style="margin:0;">Recent games</h2></div>
    <div class="feed" id="games-feed">
      <div class="card skel" style="height:60px;"></div>
    </div>
  </main>
</div>

<script type="module">
import { supabase, requireSession, getProfile, initials } from './js/supabase-client.js';
import { mountShell } from './js/nav.js';

const session = await requireSession();
const user = session.user;
const profile = await getProfile(user.id);
mountShell({ active: 'profile.html', profile });

document.getElementById('profile-header').innerHTML = `
  <div class="flex flex-center gap-2">
    <div class="avatar" style="width:64px;height:64px;font-size:1.4rem;">${initials(profile.display_name || profile.username)}</div>
    <div style="flex:1;">
      <h2 style="margin:0;">${escapeHtml(profile.display_name || profile.username)}</h2>
      <div class="text-muted text-sm">@${escapeHtml(profile.username)} · ${escapeHtml(profile.league || 'Wood')} league</div>
      ${profile.bio ? `<p class="mt-1" style="margin-bottom:0;">${escapeHtml(profile.bio)}</p>` : ''}
    </div>
    <a href="settings.html" class="btn btn-secondary btn-sm">Edit profile</a>
  </div>
`;

const ratings = profile.ratings || { bullet: 1200, blitz: 1200, rapid: 1200, puzzle: 1000 };
document.getElementById('ratings-grid').innerHTML = Object.entries(ratings).map(([bucket, val]) => `
  <div class="card card-tight" style="text-align:center;">
    <div class="text-faint text-xs" style="text-transform:uppercase;letter-spacing:.05em;">${bucket}</div>
    <div style="font-family:var(--font-display);font-size:1.6rem;font-weight:700;">${val}</div>
  </div>
`).join('');

async function loadGames() {
  const { data: games } = await supabase
    .from('games')
    .select('id, white_id, black_id, bot_id, result, end_reason, rated, time_control, updated_at, status')
    .or(`white_id.eq.${user.id},black_id.eq.${user.id}`)
    .eq('status', 'finished')
    .order('updated_at', { ascending: false })
    .limit(20);

  const feed = document.getElementById('games-feed');
  if (!games || !games.length) {
    feed.innerHTML = '<div class="card empty-state">No finished games yet.</div>';
    return;
  }

  const oppIds = [...new Set(games.map((g) => (g.white_id === user.id ? g.black_id : g.white_id)).filter(Boolean))];
  let opponents = {};
  if (oppIds.length) {
    const { data } = await supabase.from('profiles').select('id, display_name, username').in('id', oppIds);
    opponents = Object.fromEntries((data || []).map((p) => [p.id, p]));
  }

  feed.innerHTML = games.map((g) => {
    const isWhite = g.white_id === user.id;
    const oppId = isWhite ? g.black_id : g.white_id;
    const oppName = g.bot_id ? g.bot_id.replace(/-/g, ' ') : (opponents[oppId]?.display_name || opponents[oppId]?.username || 'Unknown');
    const won = (isWhite && g.result === '1-0') || (!isWhite && g.result === '0-1');
    const drew = g.result === '1/2-1/2';
    const outcome = drew ? 'draw' : won ? 'win' : 'loss';
    return `
      <div class="card card-tight flex flex-center gap-2" style="justify-content:space-between;">
        <div>
          <div style="font-weight:600;font-size:.88rem;">${isWhite ? 'White' : 'Black'} vs ${escapeHtml(oppName)}</div>
          <div class="text-faint text-xs">${g.rated ? 'Rated' : 'Casual'} · ${g.time_control} · ${(g.end_reason || '').replace(/-/g,' ')}</div>
        </div>
        <span class="badge ${outcome === 'win' ? 'badge-success' : outcome === 'loss' ? 'badge-danger' : 'badge-info'}">${outcome}</span>
      </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

loadGames();
</script>
</body>
</html>
