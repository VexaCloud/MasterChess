  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo"><svg class="icon-lg"><use href="#icon-logo"/></svg> MasterChess</div>
      <nav>
        <a href="index.html"><svg class="icon"><use href="#icon-home"/></svg> Home</a>
        <a href="play.html"><svg class="icon"><use href="#icon-play"/></svg> Play</a>
        <a href="bots.html"><svg class="icon"><use href="#icon-bot"/></svg> Bots</a>
        <a href="puzzles.html"><svg class="icon"><use href="#icon-puzzle"/></svg> Puzzles</a>
        <a href="learn.html"><svg class="icon"><use href="#icon-learn"/></svg> Learn</a>
        <a href="variants.html"><svg class="icon"><use href="#icon-variants"/></svg> Variants</a>
        <a href="tournaments.html"><svg class="icon"><use href="#icon-trophy"/></svg> Tournaments</a>
        <a href="clubs.html"><svg class="icon"><use href="#icon-users"/></svg> Clubs</a>
        <a href="analysis.html"><svg class="icon"><use href="#icon-search"/></svg> Analysis</a>
        <a href="board-editor.html" class="active"><svg class="icon"><use href="#icon-variants"/></svg> Board Editor</a>
        <a href="profile.html"><svg class="icon"><use href="#icon-user"/></svg> Profile</a>
        <a href="settings.html"><svg class="icon"><use href="#icon-settings"/></svg> Settings</a>
      </nav>
    </aside>
    <main class="main">
      <h1 class="mb-2">Board Editor & PGN Tools</h1>
      <div class="alert">Setup any position, import/export PGN or FEN, share links. Free for all.</div>
      <div class="grid grid-2">
        <div>
          <div class="board-wrap mb-2"><div id="board"></div></div>
          <div class="flex gap-1" style="flex-wrap:wrap;">
            <button class="btn btn-secondary" id="btn-clear">Clear</button>
            <button class="btn btn-secondary" id="btn-startpos">Starting Position</button>
            <button class="btn btn-secondary" id="btn-flip">Flip</button>
          </div>
        </div>
        <div class="card">
          <div class="form-group">
            <label>FEN</label>
            <input type="text" id="fen-input" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
          </div>
          <div class="form-group">
            <label>PGN</label>
            <textarea id="pgn-input" rows="6" style="width:100%;padding:0.5rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:monospace;"></textarea>
          </div>
          <button class="btn btn-primary" id="btn-load-fen">Load FEN</button>
          <button class="btn btn-secondary" id="btn-load-pgn">Load PGN</button>
          <button class="btn btn-secondary" id="btn-copy-fen">Copy FEN</button>
          <button class="btn btn-secondary" id="btn-analyze">Analyze</button>
        </div>
      </div>
    </main>
  </div>
  <script src="js/chess-core.js"></script>
  <script>
    let controller;
    (async () => {
      controller = new GameController({ boardEl: document.getElementById('board') });
      await controller.init();
    })();
    document.getElementById('btn-clear').onclick = () => { controller.loadFen('8/8/8/8/8/8/8/8 w - - 0 1'); document.getElementById('fen-input').value = controller.fen(); };
    document.getElementById('btn-startpos').onclick = () => { controller.reset(); document.getElementById('fen-input').value = controller.fen(); };
    document.getElementById('btn-load-fen').onclick = () => { controller.loadFen(document.getElementById('fen-input').value); };
    document.getElementById('btn-load-pgn').onclick = () => { controller.loadPgn(document.getElementById('pgn-input').value); document.getElementById('fen-input').value = controller.fen(); };
    document.getElementById('btn-copy-fen').onclick = () => { navigator.clipboard.writeText(controller.fen()); alert('FEN copied'); };
    document.getElementById('btn-analyze').onclick = () => { location.href = 'analysis.html'; };
  </script>
</body>
</html>
